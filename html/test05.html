<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>앵커링스연습 a태그</title>
</head>
<body>
    <!--링크(a태그) 속성 적용-->
    <a href="https://www.naver.com" target="_blank" title="네이버로 이동">예제 사이트 방문 </a>
    <!---이미지(img태그) 속성 적용-->
    <img src="/img/강아지1.jpg" alt="흰 푸들" width="300">
    <img src="/img/강아지2.jpg" alt="강아지이미지" width="300" height="300">
   
    <!--입력폼 input태그에 속성 적용-->
    <form>
        <label> 사용자 이름</label>
        <input type="text" id="username" name="username" placeholder="이름입력" required="required">
        <input type="submit" value="저장">
     </form>

     <!--단락 p태그 속성 적용-->
    <p style="color: blue; font-weight: bold;">이 문장은 파란색 굵은 글씨입니다</p>

</body>
</html>
