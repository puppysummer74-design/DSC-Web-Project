<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>삭제 및 추가 문제 예제</title>
    <style>
        *{
            margin: 0px;
            padding:0px ;
            box-sizing: border-box;
        }
        body{
            font-family: "맑은 고딕" sans-serif;
            padding: 20px;
            line-height: 1.8;
        }
        del{
            color: red;
        }
        ins{
            color: green;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <H1>문서 수정 내역</H1>
    <P><del>2026년 10월 1일(월요일)에 개강 예정이었습니다.</del><br>
       <ins>2026년 10월 1일(월요일)에 개강 예정이었습니다.</ins> </P>
    <P>기존 안내문:
        <del>모든 수강생은 9시에 강의실로 입장해 주세요.</del><br>
        수정된 안내문:
<ins>모든 수강생은 10시에 강의실로 입장해 주세요.</ins>
    </P>
</body>
</html>
