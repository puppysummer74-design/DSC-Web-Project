<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>루비 문자 학습</title>
</head>

<style>
    *{
        margin: 5px;
        padding: 4px;
        box-sizing: border-box;
    }
    rt{
        color: blue;
        font-weight: bold;
        background-color: yellow;
    }
</style>
  
<body>
    <h1>루비 문자(Ruby Text)</h1>
    <p>
        한자 예시:
        韓한 子자
    </p>
    <p>
        한글 예시:
        청출어람 靑出於藍(푸른색은 쪽에서 나왔지만 족빛보다 더 푸르다)
    </p>
    <p>
        일본어 예시:
        學生 がくせいです
    </p>

    <hr />

    <h1>루비 문자(Ruby Text)</h1>
    <p>
        한자 예시:
       <ruby>韓<rt>한</style></rt>子<rt>자</rt></ruby>  
    </p>
    <p>
        한글 예시:
        <ruby><strong>청출어람</strong><rt>靑出於藍</rt></ruby> (푸른색은 쪽에서 나왔지만 족빛보다 더 푸르다)
    </p>
    <p>
        일본어 예시:
        <ruby>學生<rt><mark>がくせいです</mark></rt></ruby> 
    </p>

    <hr />

</body>
</html>
